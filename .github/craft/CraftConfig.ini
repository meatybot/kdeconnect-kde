#
# CraftMaster configuration for the Windows and macOS builds on GitHub Actions.
# Derived from https://invent.kde.org/sysadmin/craft-ci/-/blob/master/qt6/CraftConfig.ini
# with the paths changed for GitHub-hosted runners and code signing disabled,
# because the KDE signing services are only reachable from KDE's own CI.

[General]
Branch = master
ShallowClone = True

[Variables]
CreateCache = False
UseCache = True

[GeneralSettings]
General/KFHostToolingVersion = 6
Paths/DownloadDir = ${Variables:Root}/downloads
Paths/KDEGitDir = ${Variables:Root}/downloads/git/
Packager/CacheDir = ${Variables:Root}/cache
Packager/RepositoryUrl = https://files.kde.org/craft/Qt6/
Packager/UseCache = ${Variables:UseCache}
Packager/CreateCache = ${Variables:CreateCache}
Blueprints/BlueprintRoot = ${Variables:Root}/blueprints
ContinuousIntegration/Enabled = True
ContinuousIntegration/OutputOnFailure = True
ContinuousIntegration/UpdateRepository = True
CodeSigning/Enabled = False

[BlueprintSettings]
libs/qt.qtMajorVersion = 6
libs/qt5.ignored = True
libs/qt6/qtdoc.ignored = True
/.buildTests = False

[windows-msvc2022_64-cl]
General/ABI = windows-cl-msvc2022-x86_64
Compile/BuildType = RelWithDebInfo
Tools/UseSystemCurl = False
Paths/Python = ${Env:pythonLocation}
Paths/Msys = C:/msys64
ShortPath/JunctionDir = C:/_

[macos-arm-clang]
General/ABI = macos-clang-arm64
Compile/BuildType = RelWithDebInfo
Packager/PackageType = MacDMGPackager
